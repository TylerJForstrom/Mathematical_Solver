<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mathematical Solver Demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">MS</div>
        <div>
          <h1>Mathematical Solver</h1>
          <p>Logic, algebra, calculus, statistics, matrices, and complex numbers from expression trees.</p>
        </div>
      </header>

      <section class="solver-card" aria-label="Solver">
        <div class="mode-tabs" aria-label="Solver mode">
          <button type="button" data-mode="ask">Ask</button>
          <button type="button" data-mode="equation">Equation</button>
          <button type="button" data-mode="simplify">Simplify</button>
          <button type="button" data-mode="derivative">Derivative</button>
          <button type="button" data-mode="statistics">Stats</button>
          <button type="button" data-mode="logic">Logic</button>
        </div>

        <label class="input-label" for="statementInput">Problem</label>
        <textarea id="statementInput" spellcheck="false"></textarea>

        <div class="sample-row" aria-label="Examples">
          <button type="button" data-sample-mode="equation" data-sample="x^2 - 5x + 6 = 0">Quadratic</button>
          <button type="button" data-sample-mode="equation" data-sample="x^2 - 2 = 0">Radical</button>
          <button type="button" data-sample-mode="equation" data-sample="x^3 - 6x^2 + 11x - 6 = 0">Cubic</button>
          <button type="button" data-sample-mode="simplify" data-sample="2x + 3x - 4 + 10">Like terms</button>
          <button type="button" data-sample-mode="simplify" data-sample="sin(x)^2 + cos(x)^2">Trig simp</button>
          <button type="button" data-sample-mode="simplify" data-sample="sin(2x)">DoubleAngle</button>
          <button type="button" data-sample-mode="simplify" data-sample="1/cos(x)">Reciprocal</button>
          <button type="button" data-sample-mode="simplify" data-sample="sin(pi/2 - x)">Cofunction</button>
          <button type="button" data-sample-mode="simplify" data-sample="sin(x)*cos(y)">ProdSum</button>
          <button type="button" data-sample-mode="ask" data-sample="power reduce sin(x)^2">PowerRed</button>
          <button type="button" data-sample-mode="ask" data-sample="factor x^3 - 6x^2 + 11x - 6">Factor</button>
          <button type="button" data-sample-mode="ask" data-sample="10 choose 3">Choose</button>
          <button type="button" data-sample-mode="ask" data-sample="gcd 84 126">GCD</button>
          <button type="button" data-sample-mode="ask" data-sample="mod inverse 3 mod 11">Mod inv</button>
          <button type="button" data-sample-mode="ask" data-sample="crt x=2 mod 3; x=3 mod 5; x=2 mod 7">CRT</button>
          <button type="button" data-sample-mode="ask" data-sample="solve x^2 - 5x + 6 > 0">Inequality</button>
          <button type="button" data-sample-mode="derivative" data-sample="x^3 + 2x^2 - 7x + 4">Derivative</button>
          <button type="button" data-sample-mode="ask" data-sample="solve system 2x + y = 5; x - y = 1">System</button>
          <button type="button" data-sample-mode="ask" data-sample="solve nonlinear system x^2 + y^2 = 25; x - y = 1 guess x=3 y=2">NonlinearSys</button>
          <button type="button" data-sample-mode="ask" data-sample="det [[1,2],[3,4]]">Matrix</button>
          <button type="button" data-sample-mode="ask" data-sample="dot [1,2,3] [4,5,6]">Dot</button>
          <button type="button" data-sample-mode="ask" data-sample="angle between [1,0] [0,1]">Angle</button>
          <button type="button" data-sample-mode="ask" data-sample="projection [3,4] onto [1,0]">Project</button>
          <button type="button" data-sample-mode="ask" data-sample="circle radius=3">Circle</button>
          <button type="button" data-sample-mode="ask" data-sample="pythagorean a=3 b=4">Pythag</button>
          <button type="button" data-sample-mode="ask" data-sample="distance between (1,2) and (4,6)">Distance</button>
          <button type="button" data-sample-mode="ask" data-sample="rref [[1,2,1],[2,4,2],[1,1,0]]">RREF</button>
          <button type="button" data-sample-mode="ask" data-sample="row space [[1,2,1],[2,4,2],[1,1,0]]">RowSp</button>
          <button type="button" data-sample-mode="ask" data-sample="column space [[1,2,1],[2,4,2],[1,1,0]]">ColSp</button>
          <button type="button" data-sample-mode="ask" data-sample="qr [[1,1],[1,0],[0,1]]">QR</button>
          <button type="button" data-sample-mode="ask" data-sample="svd [[3,1],[1,3]]">SVD</button>
          <button type="button" data-sample-mode="ask" data-sample="eigen [[2,1],[1,2]]">Eigen</button>
          <button type="button" data-sample-mode="ask" data-sample="eigenvectors [[0,-1],[1,0]]">CxVec</button>
          <button type="button" data-sample-mode="ask" data-sample="eigenvalues [[4,1,0],[1,3,0],[0,0,2]]">EigVals</button>
          <button type="button" data-sample-mode="ask" data-sample="eigenvectors [[4,1,0],[1,3,0],[0,0,2]]">SymVec</button>
          <button type="button" data-sample-mode="ask" data-sample="dominant eigen [[4,1,0],[1,3,0],[0,0,2]]">DomEig</button>
          <button type="button" data-sample-mode="ask" data-sample="arithmetic sequence a1=3 d=5 n=10">Sequence</button>
          <button type="button" data-sample-mode="ask" data-sample="sum k^2 from k=1 to 5">Sigma</button>
          <button type="button" data-sample-mode="ask" data-sample="nullspace [[1,2,1],[2,4,2],[1,1,0]]">Null</button>
          <button type="button" data-sample-mode="ask" data-sample="eigenvectors [[2,1],[1,2]]">EVec</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate x^2 + 3x">Integral</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate x^2 from 0 to 3">Definite</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate (2x + 3)/(x^2 + 3x + 2)">PartialFrac</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate 1/(x - 1)^2">RepeatedPF</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate 1/(x^2 + 1)">AtanInt</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate 2x*cos(x^2)">USub</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate x*exp(x)">ByParts</button>
          <button type="button" data-sample-mode="ask" data-sample="limit (x^2 - 1)/(x - 1) as x approaches 1">Limit</button>
          <button type="button" data-sample-mode="ask" data-sample="partial derivative of x^2*y + y^3 with respect to y">Partial</button>
          <button type="button" data-sample-mode="ask" data-sample="gradient x^2 + x*y + y^2 at x=1 y=2">Gradient</button>
          <button type="button" data-sample-mode="ask" data-sample="directional derivative x^2 + x*y + y^2 at x=1 y=2 direction [3,4]">DirDeriv</button>
          <button type="button" data-sample-mode="ask" data-sample="taylor sin(x) order=5">Taylor</button>
          <button type="button" data-sample-mode="ask" data-sample="laplace transform of sin(t) + 2t">Laplace</button>
          <button type="button" data-sample-mode="ask" data-sample="complex (3+4i)*(2-i)">Complex</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate sin(x)">Trig int</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate exp(x) from 0 to 1">Exp int</button>
          <button type="button" data-sample-mode="ask" data-sample="maximize -x^2 + 4x + 1">Max</button>
          <button type="button" data-sample-mode="ask" data-sample="linear programming maximize 3x + 2y subject to x + y <= 4; x <= 2; y <= 3; x >= 0; y >= 0">LinearProg</button>
          <button type="button" data-sample-mode="ask" data-sample="graph x^2 - 4 from -5 to 5">Graph</button>
          <button type="button" data-sample-mode="ask" data-sample="graph tangent line x^2 at x=2 from 0 to 4">Tangent</button>
          <button type="button" data-sample-mode="ask" data-sample="fourier series x from -pi to pi order=5">Fourier</button>
          <button type="button" data-sample-mode="ask" data-sample="newton x^3 - x - 2 guess=1">Newton</button>
          <button type="button" data-sample-mode="ask" data-sample="secant x^2 - 2 guess=1 guess2=2">Secant</button>
          <button type="button" data-sample-mode="ask" data-sample="fixed point cos(x) guess=0.5">FixedPoint</button>
          <button type="button" data-sample-mode="ask" data-sample="bisection x^2 - 4 interval 0 3">Bisection</button>
          <button type="button" data-sample-mode="ask" data-sample="simpson integrate sin(x) from 0 to pi n=100">Simpson</button>
          <button type="button" data-sample-mode="ask" data-sample="ode dy/dt = 0.3y y0=2 t=5">ODE</button>
          <button type="button" data-sample-mode="ask" data-sample="ode system x'=y; y'=-2x - 3y; x0=1 y0=0 t=1">ODESys</button>
          <button type="button" data-sample-mode="ask" data-sample="ode nonlinear x'=x-y-x^3; y'=x+y; x0=1 y0=0 t=5 h=0.1">NLODESys</button>
          <button type="button" data-sample-mode="ask" data-sample="rk4 dy/dt = t + y y0=1 from t=0 to 1 h=0.25">RK4</button>
          <button type="button" data-sample-mode="ask" data-sample="logistic r=0.4 K=100 y0=10 t=8">Logistic</button>
          <button type="button" data-sample-mode="ask" data-sample="newton cooling ambient=70 initial=100 k=0.2 t=10">Cooling</button>
          <button type="button" data-sample-mode="statistics" data-sample="regression for (1,2), (2,3), (3,5), (4,8); predict x=5">Regression</button>
          <button type="button" data-sample-mode="statistics" data-sample="pearson correlation x: 1, 2, 3, 4, 5, 6; y: 2, 4, 5, 4, 5, 7">Pearson</button>
          <button type="button" data-sample-mode="statistics" data-sample="spearman correlation x: 1, 2, 3, 4, 5, 6; y: 1, 3, 2, 5, 4, 6">Spearman</button>
          <button type="button" data-sample-mode="statistics" data-sample="kendall correlation x: 1, 2, 2, 3, 4, 5; y: 1, 2, 3, 3, 5, 4">Kendall</button>
          <button type="button" data-sample-mode="statistics" data-sample="quadratic regression degree=2 for (1,2), (2,5), (3,10), (4,17); predict x=5">PolyReg</button>
          <button type="button" data-sample-mode="statistics" data-sample="multiple regression y: 4, 7, 9, 12, 15; x1: 1, 2, 3, 4, 5; x2: 0, 1, 0, 1, 1; predict x1=6 x2=0">MultiReg</button>
          <button type="button" data-sample-mode="statistics" data-sample="regression diagnostics y: 2, 3, 5, 8, 13, 21; x: 1, 2, 3, 4, 5, 6">RegDiag</button>
          <button type="button" data-sample-mode="statistics" data-sample="compare regression models y: 2, 3, 5, 8, 13, 21; x: 1, 2, 3, 4, 5, 6 degrees=1,2,3">Compare</button>
          <button type="button" data-sample-mode="statistics" data-sample="ridge regression lambda=1 y: 4, 7, 9, 12, 15; x1: 1, 2, 3, 4, 5; x2: 0, 1, 0, 1, 1; predict x1=6 x2=0">Ridge</button>
          <button type="button" data-sample-mode="statistics" data-sample="lasso regression lambda=1 y: 4, 7, 9, 12, 15; x1: 1, 2, 3, 4, 5; x2: 0, 1, 0, 1, 1; predict x1=6 x2=0">Lasso</button>
          <button type="button" data-sample-mode="statistics" data-sample="bayesian linear regression y: 4, 7, 9, 12, 15; x: 1, 2, 3, 4, 5; priorMean=0 priorSd=10 sigma=1 predict x=6">BayesReg</button>
          <button type="button" data-sample-mode="statistics" data-sample="logistic regression y: 0,0,1,0,1,1; x: 1,2,3,4,5,6; predict x=4.5">LogReg</button>
          <button type="button" data-sample-mode="statistics" data-sample="naive bayes class: 0, 0, 0, 1, 1, 1; x1: 1, 2, 1.5, 5, 6, 5.5; x2: 1, 1.2, 0.8, 5, 5.5, 4.8; predict x1=3.1 x2=2.6">NaiveBayes</button>
          <button type="button" data-sample-mode="statistics" data-sample="lda class: 0, 0, 0, 1, 1, 1; x1: 1, 2, 1.5, 5, 6, 5.5; x2: 1, 1.2, 0.8, 5, 5.5, 4.8; regularization=0.001 predict x1=5.2 x2=5">LDA</button>
          <button type="button" data-sample-mode="statistics" data-sample="qda class: 0, 0, 0, 1, 1, 1; x1: 1, 2, 1.5, 5, 6, 5.5; x2: 1, 1.2, 0.8, 5, 5.5, 4.8; regularization=0.001 predict x1=5.2 x2=5">QDA</button>
          <button type="button" data-sample-mode="statistics" data-sample="decision tree class: 0, 0, 0, 1, 1, 1; x1: 1, 2, 1.5, 5, 6, 5.5; x2: 1, 1.2, 0.8, 5, 5.5, 4.8; maxDepth=2 predict x1=5.2 x2=5">Tree</button>
          <button type="button" data-sample-mode="statistics" data-sample="random forest class: 0, 0, 0, 1, 1, 1; x1: 1, 2, 1.5, 5, 6, 5.5; x2: 1, 1.2, 0.8, 5, 5.5, 4.8; trees=9 maxDepth=2 seed=7 predict x1=5.2 x2=5">Forest</button>
          <button type="button" data-sample-mode="statistics" data-sample="roc actual: 1, 1, 0, 1, 0, 0; scores: 0.9, 0.75, 0.6, 0.55, 0.3, 0.1">ROC</button>
          <button type="button" data-sample-mode="statistics" data-sample="poisson regression y: 1, 2, 1, 3, 4, 5; x: 0, 1, 2, 3, 4, 5; predict x=6">PoisReg</button>
          <button type="button" data-sample-mode="statistics" data-sample="ar(1) series: 10, 12, 13, 15, 16, 18 forecast=3">AR(1)</button>
          <button type="button" data-sample-mode="statistics" data-sample="arima(2,1,0) series: 10, 13, 15, 18, 22, 27, 31, 38 forecast=3">ARIMA</button>
          <button type="button" data-sample-mode="statistics" data-sample="pca x: 1,2,3,4,5; y: 2,3,5,8,13; z: 5,4,3,2,1">PCA</button>
          <button type="button" data-sample-mode="statistics" data-sample="covariance matrix x: 1,2,3,4; y: 2,3,5,8">Cov</button>
          <button type="button" data-sample-mode="statistics" data-sample="k-means k=3 points (1,1), (1,2), (5,5), (6,5), (10,10), (10,11)">KMeans</button>
          <button type="button" data-sample-mode="statistics" data-sample="95 confidence interval for 10, 12, 14, 16, 18">Confidence</button>
          <button type="button" data-sample-mode="statistics" data-sample="bootstrap mean data 10, 12, 14, 16, 18 resamples=1000 seed=7 confidence=95">Bootstrap</button>
          <button type="button" data-sample-mode="statistics" data-sample="normality test data 10, 12, 13, 15, 30, 31, 32, 33">Normality</button>
          <button type="button" data-sample-mode="statistics" data-sample="meta-analysis effects: 0.2, 0.5, 0.1, 0.7; se: 0.1, 0.2, 0.15, 0.25">Meta</button>
          <button type="button" data-sample-mode="statistics" data-sample="adjust p-values p: 0.003, 0.02, 0.04, 0.20, 0.001 alpha=0.05">FDR</button>
          <button type="button" data-sample-mode="statistics" data-sample="proportion ci successes=42 n=100 confidence=95">Prop CI</button>
          <button type="button" data-sample-mode="statistics" data-sample="power mean effect=0.5 n=64 alpha=0.05">Power</button>
          <button type="button" data-sample-mode="statistics" data-sample="sample size mean effect=0.5 power=0.8 alpha=0.05">Size</button>
          <button type="button" data-sample-mode="statistics" data-sample="variance test group1: 10, 12, 9, 11; group2: 8, 7, 11, 9">VarTest</button>
          <button type="button" data-sample-mode="statistics" data-sample="t-test mean=10 data 8, 9, 11, 12, 10">T-test</button>
          <button type="button" data-sample-mode="statistics" data-sample="two-proportion z-test successes1=56 n1=100 successes2=44 n2=100">2-prop</button>
          <button type="button" data-sample-mode="statistics" data-sample="two-sample t-test group1: 10, 12, 9; group2: 8, 7, 11">2-sample</button>
          <button type="button" data-sample-mode="statistics" data-sample="permutation test group1: 10, 12, 9; group2: 8, 7, 11 resamples=2000 seed=5">Permute</button>
          <button type="button" data-sample-mode="statistics" data-sample="kaplan-meier times: 5, 6, 6, 8, 10; events: 1, 1, 0, 1, 0">Survival</button>
          <button type="button" data-sample-mode="statistics" data-sample="log-rank group1 times: 5, 6, 6, 8, 10 events: 1, 1, 0, 1, 0; group2 times: 4, 6, 7, 9, 12 events: 1, 0, 1, 1, 0">LogRank</button>
          <button type="button" data-sample-mode="statistics" data-sample="cox regression times: 5, 6, 6, 8, 10, 12; events: 1, 1, 0, 1, 0, 1; x: 0, 1, 0, 1, 1, 0">Cox</button>
          <button type="button" data-sample-mode="statistics" data-sample="paired t-test before: 10, 12, 9; after: 11, 14, 10">Paired</button>
          <button type="button" data-sample-mode="statistics" data-sample="ANOVA group1: 8, 9, 10; group2: 12, 13, 14; group3: 9, 11, 10">ANOVA</button>
          <button type="button" data-sample-mode="statistics" data-sample="welch anova group1: 8,9,10; group2: 14,16,17; group3: 20,24,29">WelchA</button>
          <button type="button" data-sample-mode="statistics" data-sample="manova control: (1,2), (2,1), (1.5,1.8), (2.2,2.5); treatment: (4,5), (5,4.5), (4.2,5.2), (5.1,5.4); followup: (6,7), (7,6.5), (6.5,7.2), (7.1,7.4)">MANOVA</button>
          <button type="button" data-sample-mode="statistics" data-sample="ancova y: 10,12,13,15,14,17,18,21; group: control,control,control,control,treatment,treatment,treatment,treatment; x: 1,2,3,4,1,2,3,4">ANCOVA</button>
          <button type="button" data-sample-mode="statistics" data-sample="repeated measures anova baseline: 10,12,11,13; week1: 12,13,12,15; week2: 14,15,13,17">RM-A</button>
          <button type="button" data-sample-mode="statistics" data-sample="two-way anova y: 6,7,8,9,10,11,15,16; A: low,low,low,low,high,high,high,high; B: control,control,treatment,treatment,control,control,treatment,treatment">2WayA</button>
          <button type="button" data-sample-mode="statistics" data-sample="chi-square observed 10, 20, 30 expected 15, 15, 30">Chi-square</button>
          <button type="button" data-sample-mode="statistics" data-sample="chi-square independence [[30,10],[20,40]]">Independ</button>
          <button type="button" data-sample-mode="statistics" data-sample="fisher exact [[1,9],[11,3]]">Fisher</button>
          <button type="button" data-sample-mode="statistics" data-sample="inverse normal p=0.975 mean=0 sd=1">Inv normal</button>
          <button type="button" data-sample-mode="statistics" data-sample="student t df=10 x=2 greater">T-dist</button>
          <button type="button" data-sample-mode="statistics" data-sample="chi-square distribution df=5 x=10 greater">ChiDist</button>
          <button type="button" data-sample-mode="statistics" data-sample="f distribution df1=5 df2=10 x=2 greater">F-dist</button>
          <button type="button" data-sample-mode="statistics" data-sample="poisson lambda=3 at most k=2">Poisson</button>
          <button type="button" data-sample-mode="statistics" data-sample="geometric p=0.25 k=3">Geometric</button>
          <button type="button" data-sample-mode="statistics" data-sample="exponential lambda=2 x=1">Exponential</button>
          <button type="button" data-sample-mode="statistics" data-sample="uniform min=2 max=10 between 4 and 7">Uniform</button>
          <button type="button" data-sample-mode="statistics" data-sample="hypergeometric population=50 successes=5 draws=10 k=2">Hypergeom</button>
          <button type="button" data-sample-mode="statistics" data-sample="expected value values: 0, 1, 2 probabilities: 0.2, 0.5, 0.3">Expected</button>
          <button type="button" data-sample-mode="statistics" data-sample="bayes prior=0.01 sensitivity=0.99 specificity=0.95">Bayes</button>
          <button type="button" data-sample-mode="statistics" data-sample="bayesian ab test A: 120/1000; B: 150/1000; alpha=1 beta=1">BayesAB</button>
          <button type="button" data-sample-mode="statistics" data-sample="bayesian normal mean data: 10, 12, 14, 15; priorMean=11 priorSd=3 sigma=2 threshold=13">BayesNorm</button>
          <button type="button" data-sample-mode="statistics" data-sample="markov [[0.7,0.3],[0.2,0.8]] start [1,0] steps=3">Markov</button>
          <button type="button" data-sample-mode="statistics" data-sample="stationary markov [[0.7,0.3],[0.2,0.8]]">Stationary</button>
          <button type="button" data-sample-mode="statistics" data-sample="beta posterior successes=12 n=20 alpha=2 beta=2 confidence=95">Beta</button>
          <button type="button" data-sample-mode="statistics" data-sample="mann-whitney group1: 10, 12, 9; group2: 8, 7, 11">Mann-U</button>
          <button type="button" data-sample-mode="statistics" data-sample="wilcoxon signed-rank before: 10, 12, 9, 11; after: 11, 15, 11, 15">Wilcoxon</button>
          <button type="button" data-sample-mode="statistics" data-sample="kruskal-wallis group1: 8,9,10; group2: 12,13,14; group3: 9,11,10">Kruskal</button>
          <button type="button" data-sample-mode="ask" data-sample="what is the mean of 2, 4, 4, 5, 9?">Ask stats</button>
          <button type="button" data-sample-mode="ask" data-sample="simplify logic P and (not P)">BoolSimp</button>
          <button type="button" data-sample-mode="ask" data-sample="cnf P -> (Q and R)">CNF</button>
          <button type="button" data-sample-mode="ask" data-sample="tableau (P or Q) and (not P or R)">Tableau</button>
          <button type="button" data-sample-mode="ask" data-sample="graphviz x^2 + 3x">DOT</button>
          <button
            type="button"
            data-sample-mode="logic"
            data-sample="(P and Q) -> R"
            data-compare="not (P and Q) or R"
          >Logic</button>
        </div>

        <div class="control-strip">
          <div id="mathControls" class="small-control">
            <label for="variableInput">Variable</label>
            <input id="variableInput" type="text" value="x" spellcheck="false">
          </div>

          <div id="logicControls" class="logic-controls" hidden>
            <div class="small-control compare-control">
              <label for="compareInput">Compare with</label>
              <input id="compareInput" type="text" spellcheck="false">
            </div>
            <button type="button" id="flipAllButton">Flip values</button>
          </div>
        </div>

        <div id="valuesPanel" class="values-panel" aria-live="polite"></div>
        <div id="errorBox" class="error-box" role="alert" hidden></div>

        <section id="resultBanner" class="answer-band" aria-live="polite">
          <div>
            <span id="modeBadge">Equation</span>
            <strong id="resultLabel">x = 2, x = 3</strong>
            <p id="resultDetail">Solving for x</p>
          </div>
          <div class="summary-pill">
            <span id="summaryBadge">quadratic solution</span>
          </div>
        </section>
      </section>

      <section class="insight-grid" aria-label="Visual explanation">
        <section class="panel tree-panel" aria-labelledby="treeTitle">
          <div class="panel-heading">
            <h2 id="treeTitle">Expression Tree</h2>
            <div class="metric-row">
              <span><strong id="nodesMetric">0</strong> nodes</span>
              <span><strong id="heightMetric">0</strong> high</span>
              <span><strong id="operatorsMetric">0</strong> ops</span>
              <span><strong id="variablesMetric">0</strong> vars</span>
            </div>
          </div>
          <div class="tree-frame">
            <svg id="treeSvg" role="img" aria-label="Expression tree"></svg>
          </div>
        </section>

        <section class="panel output-panel" aria-labelledby="outputTitle">
          <div class="panel-heading">
            <h2 id="outputTitle">Result Details</h2>
            <span class="variable-count"><strong id="variableCount">0</strong> variables</span>
          </div>
          <div id="outputPanel"></div>
        </section>
      </section>

      <section class="panel steps-panel" aria-labelledby="stepsTitle">
        <div class="panel-heading">
          <h2 id="stepsTitle">Steps</h2>
        </div>
        <ol id="stepsList" class="steps-list"></ol>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
