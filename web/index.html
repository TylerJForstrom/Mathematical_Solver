<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mathematical Solver Demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">MS</div>
        <div>
          <h1>Mathematical Solver</h1>
          <p>Logic, algebra, equations, and derivatives from expression trees.</p>
        </div>
      </header>

      <section class="solver-card" aria-label="Solver">
        <div class="mode-tabs" aria-label="Solver mode">
          <button type="button" data-mode="ask">Ask</button>
          <button type="button" data-mode="equation">Equation</button>
          <button type="button" data-mode="simplify">Simplify</button>
          <button type="button" data-mode="derivative">Derivative</button>
          <button type="button" data-mode="statistics">Stats</button>
          <button type="button" data-mode="logic">Logic</button>
        </div>

        <label class="input-label" for="statementInput">Problem</label>
        <textarea id="statementInput" spellcheck="false"></textarea>

        <div class="sample-row" aria-label="Examples">
          <button type="button" data-sample-mode="equation" data-sample="x^2 - 5x + 6 = 0">Quadratic</button>
          <button type="button" data-sample-mode="simplify" data-sample="2x + 3x - 4 + 10">Like terms</button>
          <button type="button" data-sample-mode="derivative" data-sample="x^3 + 2x^2 - 7x + 4">Derivative</button>
          <button type="button" data-sample-mode="ask" data-sample="solve system 2x + y = 5; x - y = 1">System</button>
          <button type="button" data-sample-mode="ask" data-sample="det [[1,2],[3,4]]">Matrix</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate x^2 + 3x">Integral</button>
          <button type="button" data-sample-mode="ask" data-sample="integrate x^2 from 0 to 3">Definite</button>
          <button type="button" data-sample-mode="ask" data-sample="maximize -x^2 + 4x + 1">Max</button>
          <button type="button" data-sample-mode="ask" data-sample="graph x^2 - 4 from -5 to 5">Graph</button>
          <button type="button" data-sample-mode="ask" data-sample="newton x^3 - x - 2 guess=1">Newton</button>
          <button type="button" data-sample-mode="statistics" data-sample="regression for (1,2), (2,3), (3,5), (4,8)">Regression</button>
          <button type="button" data-sample-mode="statistics" data-sample="95 confidence interval for 10, 12, 14, 16, 18">Confidence</button>
          <button type="button" data-sample-mode="statistics" data-sample="t-test mean=10 data 8, 9, 11, 12, 10">T-test</button>
          <button type="button" data-sample-mode="statistics" data-sample="two-sample t-test group1: 10, 12, 9; group2: 8, 7, 11">2-sample</button>
          <button type="button" data-sample-mode="statistics" data-sample="chi-square observed 10, 20, 30 expected 15, 15, 30">Chi-square</button>
          <button type="button" data-sample-mode="ask" data-sample="what is the mean of 2, 4, 4, 5, 9?">Ask stats</button>
          <button
            type="button"
            data-sample-mode="logic"
            data-sample="(P and Q) -> R"
            data-compare="not (P and Q) or R"
          >Logic</button>
        </div>

        <div class="control-strip">
          <div id="mathControls" class="small-control">
            <label for="variableInput">Variable</label>
            <input id="variableInput" type="text" value="x" spellcheck="false">
          </div>

          <div id="logicControls" class="logic-controls" hidden>
            <div class="small-control compare-control">
              <label for="compareInput">Compare with</label>
              <input id="compareInput" type="text" spellcheck="false">
            </div>
            <button type="button" id="flipAllButton">Flip values</button>
          </div>
        </div>

        <div id="valuesPanel" class="values-panel" aria-live="polite"></div>
        <div id="errorBox" class="error-box" role="alert" hidden></div>

        <section id="resultBanner" class="answer-band" aria-live="polite">
          <div>
            <span id="modeBadge">Equation</span>
            <strong id="resultLabel">x = 2, x = 3</strong>
            <p id="resultDetail">Solving for x</p>
          </div>
          <div class="summary-pill">
            <span id="summaryBadge">quadratic solution</span>
          </div>
        </section>
      </section>

      <section class="insight-grid" aria-label="Visual explanation">
        <section class="panel tree-panel" aria-labelledby="treeTitle">
          <div class="panel-heading">
            <h2 id="treeTitle">Expression Tree</h2>
            <div class="metric-row">
              <span><strong id="nodesMetric">0</strong> nodes</span>
              <span><strong id="heightMetric">0</strong> high</span>
              <span><strong id="operatorsMetric">0</strong> ops</span>
              <span><strong id="variablesMetric">0</strong> vars</span>
            </div>
          </div>
          <div class="tree-frame">
            <svg id="treeSvg" role="img" aria-label="Expression tree"></svg>
          </div>
        </section>

        <section class="panel output-panel" aria-labelledby="outputTitle">
          <div class="panel-heading">
            <h2 id="outputTitle">Result Details</h2>
            <span class="variable-count"><strong id="variableCount">0</strong> variables</span>
          </div>
          <div id="outputPanel"></div>
        </section>
      </section>

      <section class="panel steps-panel" aria-labelledby="stepsTitle">
        <div class="panel-heading">
          <h2 id="stepsTitle">Steps</h2>
        </div>
        <ol id="stepsList" class="steps-list"></ol>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
